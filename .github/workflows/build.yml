# DRAFT — builds the Windows and macOS release archives. Not yet run.
# Manual trigger only; produces artifacts, never a GitHub Release (see docs/releasing.md).
name: build

on:
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows-x64
          - os: macos-14
            tag: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group build --group dev
      - run: uv run --locked --group dev pytest -q
      - run: uv run --locked --group build python packaging/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: EverythingMarkdown-${{ matrix.tag }}
          path: dist/EverythingMarkdown-*-${{ matrix.tag }}.zip
          if-no-files-found: error
