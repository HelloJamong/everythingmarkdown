# Release: pushing a version tag (e.g. 26.1.0, no "v") builds and pushes the Docker image.
# Pushes `latest` and the version tag from one build, then publishes the GitHub Release with
# the changelog section as notes, docker-compose.yml + env.example, and an offline image bundle
# (docker save | gzip) for air-gapped installs attached (README > 릴리즈, 폐쇄망 설치).
name: build

on:
  push:
    tags: ["[0-9][0-9].[0-9]+.[0-9]+"]

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match pyproject version and a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          [ "$TAG" = "$version" ] || { echo "::error::tag $TAG != pyproject version $version"; exit 1; }
          grep -q "^## \[$TAG\] - " changelog.md || { echo "::error::changelog.md has no '## [$TAG] - <date>' entry"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/everythingmarkdown:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/everythingmarkdown:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes = this version's changelog section (same text as the tag annotation)
        run: |
          python3 - <<'PY'
          import os, re
          tag = re.escape(os.environ["TAG"])
          text = open("changelog.md", encoding="utf-8").read()
          section = re.search(rf"^## \[{tag}\] - .*?(?=^## \[|\Z)", text, re.S | re.M).group(0)
          open("notes.md", "w", encoding="utf-8", newline="\n").write(section.rstrip("\n") + "\n")
          PY
      - name: Download files for first-time setup
        # GitHub renames assets that start with a dot, so .env.example ships as env.example.
        run: |
          mkdir dist
          cp docker-compose.yml dist/docker-compose.yml
          cp .env.example dist/env.example
      - name: Offline image bundle (air-gapped installs load it with docker load)
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/everythingmarkdown:${{ github.ref_name }}
        run: |
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > "dist/everythingmarkdown-image-$TAG.tar.gz"
          (cd dist && sha256sum "everythingmarkdown-image-$TAG.tar.gz" > "everythingmarkdown-image-$TAG.tar.gz.sha256")
          ls -lh dist
      - name: Create or update the GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md dist/*
          fi
