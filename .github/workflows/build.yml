# DRAFT — builds the Windows and macOS release archives and the Docker image. Not yet run.
# Manual trigger only; produces artifacts and a Docker Hub image, never a GitHub Release (see docs/releasing.md).
# The docker job needs a Dockerfile at the repo root (web-service-plan.md P5); it fails until then.
name: build

on:
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tag: windows-x64
          - os: macos-14
            tag: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group build --group dev
      - run: uv run --locked --group dev pytest -q
      - run: uv run --locked --group build python packaging/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: EverythingMarkdown-${{ matrix.tag }}
          path: dist/EverythingMarkdown-*-${{ matrix.tag }}.zip
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/everythingmarkdown:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/everythingmarkdown:${{ steps.version.outputs.version }}
