# Release: pushing a version tag (e.g. 26.1.0, no "v") builds and pushes the Docker image.
# Pushes `latest` and the version tag from one build. GitHub Release notes stay manual (docs/releasing.md).
name: build

on:
  push:
    tags: ["[0-9][0-9].[0-9]+.[0-9]+"]

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match pyproject version and a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          [ "$TAG" = "$version" ] || { echo "::error::tag $TAG != pyproject version $version"; exit 1; }
          grep -q "^## \[$TAG\] - " changelog.md || { echo "::error::changelog.md has no '## [$TAG] - <date>' entry"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/everythingmarkdown:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/everythingmarkdown:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
