# DRAFT — builds and pushes the web service Docker image. Not yet run.
# Manual trigger only; pushes to Docker Hub, never a GitHub Release (see docs/releasing.md).
# Needs a Dockerfile at the repo root (web-service-plan.md 웹 P5); fails until then.
name: build

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/everythingmarkdown:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/everythingmarkdown:${{ steps.version.outputs.version }}
