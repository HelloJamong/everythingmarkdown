{% extends "base.html" %}
{% block title %}로그인 · EverythingMarkdown{% endblock %}
{% block body %}
<main class="login" aria-labelledby="login-title">
  <div class="login-box">
    <img class="login-logo" src="/static/logo.ico" alt="">
    <h1 id="login-title">EverythingMarkdown</h1>
    <p>비밀번호를 입력해 로그인하세요.</p>
    {% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <button class="btn primary" type="submit">로그인</button>
    </form>
  </div>
</main>
{% endblock %}
