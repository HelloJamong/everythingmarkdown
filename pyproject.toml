[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "everythingmarkdown"
version = "0.0.0"
description = "Personal web service that converts uploaded documents to Markdown"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.143.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markitdown[pdf,docx,pptx,xlsx]==0.1.7",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
    "httpx2>=2.13.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
everythingmarkdown = ["web/templates/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"scripts/**" = ["E501"]  # unavoidably long OOXML namespace literals

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["markitdown.*"]
ignore_missing_imports = true
